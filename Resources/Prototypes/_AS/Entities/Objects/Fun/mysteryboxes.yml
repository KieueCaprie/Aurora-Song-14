- type: entity
  parent: MysteryFigureBox
  id: MysteryWehBox
  name: mystery weh friend box
  description: A box containing a plush toy resembling a lizard. The box art claims that your new best friend is just a box "a-weh"!
  components:
  - type: Sprite
    sprite: _NF/Objects/Fun/spaceblade.rsi # TODO: Make a sprite for the box!
    scale: 0.65, 0.65
    layers:
      - state: sb_box
  - type: StaticPrice
    price: 160
  - type: SpawnEntityTableOnTrigger
    useMapCoords: true
    table: !type:AllSelector
      children:
      - id: SpaceBladeBoxTrash
      - !type:NestedSelector
        tableId: AllLizardPlushieGambaTable

- type: entity
  parent: MysteryFigureBox
  id: MysteryWehBoxCommand
  name: mystery limited-edition weh friend box
  description: A box containing a plush toy resembling a lizard. The box art claims that your new best friend is just a box "a-weh!" This one is extra-fancy!
  components:
  - type: Sprite
    sprite: _NF/Objects/Fun/spaceblade.rsi # TODO: Make a sprite for the box!
    scale: 0.65, 0.65
    layers:
      - state: sb_box
  - type: StaticPrice
    price: 160
  - type: SpawnItemsOnUse
    items:
      - id: SpaceBladeBoxTrash
      - id: MysteryWehRandomRare


- type: entity
  parent: MysteryWehBoxCommand
  id: MysteryWehRandomRare
  name: random rare mystery weh friend
  components:
    - type: EntityTableSpawner
      table: !type:GroupSelector
        children:
          - id: PlushieLizardJobCaptain
          - id: PlushieLizardJobChiefengineer
          - id: PlushieLizardJobChiefmedicalofficer
          - id: PlushieLizardJobHeadofpersonnel
          - id: PlushieLizardJobHeadofsecurity
          - id: PlushieLizardJobResearchdirector
          - id: PlushieLizardInversed
            weight: 0.1
          - id: PlushieLizardJobMultiweh
            weight: 0.01
